<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Forte: Simulador de Estufa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>Agro Forte, Futuro Sustentável</h1>
            <p>Gerencie sua Estufa de Tomates Tecnológica</p>
        </header>

        <main>
            <section class="plant-display">
                <div id="plant-icon">🌱</div>
                <div class="growth-box">
                    <label>Progresso do Crescimento:</label>
                    <div class="progress-bar">
                        <div id="growth-bar" style="width: 0%;">0%</div>
                    </div>
                </div>
            </section>

            <section class="controls">
                <div class="status-card">
                    <h3>💧 Umidade do Solo</h3>
                    <div class="progress-bar-small"><div id="water-bar" class="bar water" style="width: 50%;"></div></div>
                    <span id="water-text">50%</span>
                    <button onclick="regar()">Regar Solo</button>
                </div>

                <div class="status-card">
                    <h3>🌡️ Temperatura</h3>
                    <div class="progress-bar-small"><div id="temp-bar" class="bar temp" style="width: 50%;"></div></div>
                    <span id="temp-text">24°C</span>
                    <button onclick="ajustarClima()">Ligar Climatizador</button>
                </div>

                <div class="status-card">
                    <h3>🧪 Nutrientes (Orgânico)</h3>
                    <div class="progress-bar-small"><div id="nutrients-bar" class="bar nutrients" style="width: 60%;"></div></div>
                    <span id="nutrients-text">60%</span>
                    <button onclick="adubar()">Adicionar Nutrientes</button>
                </div>
            </section>

            <section class="message-center">
                <p id="game-message">Mantenha os níveis equilibrados para o tomate crescer saudável!</p>
                <button id="restart-btn" onclick="reiniciarJogo()" style="display: none;">Jogar Novamente</button>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estufa de Tomate Sustentável</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Estufa de Tomates 🍅</h1>
        <p class="subtitle">Projeto: Agro Forte, Futuro Sustentável</p>
        
        <div class="dashboard">
            <div class="stat">
                <span>Água no Solo:</span>
                <div class="progress-bar"><div id="water-bar" style="width: 50%;"></div></div>
                <span id="water-text">50%</span>
            </div>
            <div class="stat">
                <span>Temperatura Interna:</span>
                <span id="temp-text" class="good">22°C</span>
            </div>
            <div class="stat">
                <span>Crescimento do Tomate:</span>
                <div class="progress-bar growth"><div id="growth-bar" style="width: 0%;"></div></div>
                <span id="growth-text">0%</span>
            </div>
            <div class="stat">
                <span>Tomates Colhidos:</span>
                <b id="score-text">0</b>
            </div>
        </div>

        <div class="controls">
            <button id="btn-water" class="btn">💧 Irrigar Solo</button>
            <button id="btn-temp-up" class="btn">🔥 Ligar Aquecedor</button>
            <button id="btn-temp-down" class="btn">❄️ Ligar Ventilação</button>
            <button id="btn-harvest" class="btn" disabled>🧺 Colher Tomate</button>
        </div>

        <div class="info-box">
            <h3>Manual de Sustentabilidade:</h3>
            <p id="message">Mantenha a água entre 40% e 80% e a temperatura entre 20°C e 26°C para o tomate crescer rápido!</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

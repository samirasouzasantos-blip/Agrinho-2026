<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VacinaCraft 2D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="painel-topo">
        <h1>💉 VacinaCraft 2D</h1>
        <p>Monte o manejo com cercas e vacine o gado antes que o tempo esgote!</p>
        <div class="placar">
            <div>🐄 Vacinados: <span id="qtd-vacinados">0</span></div>
            <div>⏱️ Tempo: <span id="tempo-restante">45</span>s</div>
        </div>
    </div>

    <div id="grade-mundo"></div>

    <div class="hotbar">
        <div class="slot ativo" onclick="selecionarItem('fence', '🪵', this)">
            <span class="icone">🪵</span>
            <span class="legenda">Cerca</span>
        </div>
        <div class="slot" onclick="selecionarItem('syringe', '💉', this)">
            <span class="icone">💉</span>
            <span class="legenda">Vacina</span>
        </div>
        <div class="slot" onclick="selecionarItem('cow', '🐄', this)">
            <span class="icone">🐄</span>
            <span class="legenda">Gado</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

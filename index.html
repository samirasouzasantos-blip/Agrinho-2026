<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 2D: Pecuária Edition</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="header">
        <h1>🧱 MineGado 2D</h1>
        <p>Selecione um bloco na Hotbar: Clique no céu para <strong>Construir</strong> | Clique em blocos existentes para <strong>Destruir</strong></p>
    </div>

    <div id="mundo"></div>

    <div class="hotbar">
        <div class="slot ativo" onclick="selecionarItem('grass', '', this)">
            <div class="preview grass"></div>
            <span class="label">Pasto</span>
        </div>
        <div class="slot" onclick="selecionarItem('fence', '🪵', this)">
            <span class="emoji">🪵</span>
            <span class="label">Cerca</span>
        </div>
        <div class="slot" onclick="selecionarItem('water', '💧', this)">
            <span class="emoji">💧</span>
            <span class="label">Água</span>
        </div>
        <div class="slot" onclick="selecionarItem('cow', '🐄', this)">
            <span class="emoji">🐄</span>
            <span class="label">Gado</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

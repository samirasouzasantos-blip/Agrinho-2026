<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Craft 2D: Rancho de Gado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Automated 🤠 Mini-Craft 2D: Criador de Animais</h1>
    <p>Escolha um item. Clique no Céu para <strong>Construir</strong> | Clique no item feito para <strong>Remover</strong></p>

    <div id="rancho"></div>

    <div class="hotbar">
        <div class="slot ativo" onclick="mudarFerramenta('grass', '', this)">
            <div class="preview grass"></div>
            <span class="slot-texto">Pasto</span>
        </div>
        <div class="slot" onclick="mudarFerramenta('fence', '🪵', this)">
            <span style="font-size: 16px;">🪵</span>
            <span class="slot-texto">Cerca</span>
        </div>
        <div class="slot" onclick="mudarFerramenta('water', '💧', this)">
            <span style="font-size: 16px;">💧</span>
            <span class="slot-texto">Água</span>
        </div>
        <div class="slot" onclick="mudarFerramenta('cattle', '🐄', this)">
            <span style="font-size: 18px;">🐄</span>
            <span class="slot-texto">Gado</span>
        </div>
        <div class="slot" onclick="mudarFerramenta('pig', '🐖', this)">
            <span style="font-size: 18px;">🐖</span>
            <span class="slot-texto">Porco</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
